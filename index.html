<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Portfolio | นายณัฐชนน สินธำรงรักษ์</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --navy: #0f172a;
            --bg-light: #f8fafc;
            --white: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; scroll-behavior: smooth; }
        body { background-color: var(--bg-light); color: var(--text-main); line-height: 1.6; overflow-x: hidden; }

        /* แถบเมนูนำทาง */
        nav { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(10px); box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.25rem; font-weight: 700; color: var(--primary); text-decoration: none; transition: transform 0.3s ease; }
        .logo:hover { transform: scale(1.06); }
        .nav-links { display: flex; gap: 25px; align-items: center; }
        .nav-links a { color: var(--text-main); text-decoration: none; font-weight: 500; font-size: 0.95rem; position: relative; transition: color 0.3s; }
        .nav-links a:not(.btn-github-nav)::after { content: ''; position: absolute; width: 0; height: 2px; bottom: -4px; left: 0; background-color: var(--primary); transition: width 0.3s ease; }
        .nav-links a:not(.btn-github-nav):hover::after { width: 100%; }
        .nav-links a:hover { color: var(--primary); }
        .btn-github-nav { background: var(--primary); color: var(--white) !important; padding: 8px 18px; border-radius: 50px; font-size: 0.9rem; transition: transform 0.2s, background 0.3s; }
        .btn-github-nav:hover { background: var(--primary-dark); transform: translateY(-2px); }
        .menu-toggle { display: none; font-size: 1.5rem; background: none; border: none; color: var(--navy); cursor: pointer; }

        /* พื้นหลังไล่เฉดสีเคลื่อนไหว + วงกลมลอยด้านหลัง */
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        header {
            position: relative;
            overflow: hidden;
            background: linear-gradient(-45deg, #0284c7, #0369a1, #0f172a, #2563eb);
            background-size: 300% 300%;
            animation: gradientMove 8s ease infinite;
            color: var(--white);
            padding: 100px 5%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* ฟองอากาศ/วงกลมลอยตกแต่งพื้นหลัง */
        .bg-bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            animation: floatBubble 7s ease-in-out infinite;
            pointer-events: none;
        }
        .bubble-1 { width: 180px; height: 180px; top: -40px; left: 5%; animation-delay: 0s; }
        .bubble-2 { width: 250px; height: 250px; bottom: -80px; right: 10%; animation-delay: 2s; }
        .bubble-3 { width: 100px; height: 100px; top: 30%; right: 35%; animation-delay: 4s; }

        @keyframes floatBubble {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-25px) scale(1.08); }
        }

        .hero-container { position: relative; z-index: 2; max-width: 1050px; width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 40px; flex-wrap: wrap-reverse; }
        .hero-text { flex: 1; min-width: 300px; animation: fadeInUp 0.9s ease-out; }
        .badge { display: inline-block; background: rgba(255, 255, 255, 0.18); padding: 6px 16px; border-radius: 50px; font-size: 0.85rem; margin-bottom: 16px; }
        .hero-text h1 { font-size: 2.5rem; font-weight: 700; line-height: 1.25; margin-bottom: 12px; }
        .typing-box { font-size: 1.15rem; color: #7dd3fc; font-weight: 500; min-height: 32px; margin-bottom: 14px; }
        .cursor { display: inline-block; width: 2px; background-color: #fff; animation: blink 0.8s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .hero-text p { font-size: 1.05rem; color: #e0f2fe; margin-bottom: 28px; }
        .hero-buttons { display: flex; gap: 15px; flex-wrap: wrap; }
        .btn-primary { background: var(--white); color: var(--primary); padding: 12px 26px; border-radius: 8px; text-decoration: none; font-weight: 600; transition: transform 0.25s, box-shadow 0.25s; }
        .btn-primary:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25); }
        .btn-outline { border: 2px solid var(--white); color: var(--white); padding: 10px 24px; border-radius: 8px; text-decoration: none; font-weight: 500; transition: all 0.25s; }
        .btn-outline:hover { background: var(--white); color: var(--navy); transform: translateY(-4px); }

        /* วงกลมโปรไฟล์ลอยขึ้น-ลง + แสงเรืองรอบวง */
        @keyframes floatAvatar {
            0%, 100% { transform: translateY(0px) rotate(0deg); box-shadow: 0 15px 35px rgba(0,0,0,0.25); }
            50% { transform: translateY(-15px) rotate(3deg); box-shadow: 0 25px 45px rgba(56, 189, 248, 0.4); }
        }
        .avatar-circle {
            width: 220px; height: 220px; border-radius: 50%;
            background: rgba(255,255,255,0.15);
            border: 6px solid rgba(255,255,255,0.35);
            display: flex; align-items: center; justify-content: center;
            font-size: 4rem; font-weight: 700; color: #fff; margin: 0 auto;
            animation: floatAvatar 3.5s ease-in-out infinite;
            cursor: pointer;
            transition: background 0.3s;
        }
        .avatar-circle:hover { background: rgba(255,255,255,0.28); }

        /* แอนิเมชันตอนเลื่อนหน้าจอ */
        .reveal { opacity: 0; transform: translateY(35px); transition: all 0.7s ease-out; }
        .reveal.active { opacity: 1; transform: translateY(0); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } }

        .container { max-width: 1050px; margin: 0 auto; padding: 60px 20px; }
        .section-title { text-align: center; margin-bottom: 40px; }
        .section-title h2 { font-size: 1.9rem; color: var(--navy); margin-bottom: 8px; }
        .section-title .line { width: 60px; height: 4px; background: var(--primary); margin: 0 auto; border-radius: 2px; transition: width 0.4s ease; }
        .section-title:hover .line { width: 120px; }

        .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; background: var(--white); padding: 35px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04); border: 1px solid var(--border); }
        .about-info h3, .skills-box h3 { color: var(--primary); margin-bottom: 15px; font-size: 1.25rem; }
        .info-list { list-style: none; }
        .info-list li { padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 0.98rem; transition: padding-left 0.2s, color 0.2s; }
        .info-list li:hover { padding-left: 8px; color: var(--primary); }
        .info-list li strong { color: var(--navy); display: inline-block; width: 130px; }
        .skill-tags { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .skill-tag { background: #e0f2fe; color: var(--primary-dark); padding: 8px 16px; border-radius: 8px; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: transform 0.2s, background 0.2s, color 0.2s; }
        .skill-tag:hover { transform: translateY(-4px) scale(1.05); background: var(--primary); color: var(--white); }

        .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .card { background: var(--white); border-radius: 14px; overflow: hidden; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04); border: 1px solid var(--border); padding: 24px; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease; }
        .card:hover { transform: translateY(-10px); box-shadow: 0 18px 35px rgba(2, 132, 199, 0.16); border-color: var
